# =============================================================================
# ONYX BACKEND MICROSERVICE - Minimal Configuration
# =============================================================================
# Stripped down to only essential services for the backend API.
#
# Removed:
#   - nginx (reverse proxy - handle at infrastructure level)
#   - web_server (frontend - separate repo)
#   - inference_model_server (use cloud embeddings instead)
#   - indexing_model_server (use cloud embeddings instead)
#   - code-interpreter (optional feature)
#
# Usage:
#   docker compose -f docker-compose.backend-only.yml up -d
#
# Required env vars for cloud embeddings (set in .env):
#   - DISABLE_MODEL_SERVER=true
#   - Configure embedding provider via Admin UI or API
# =============================================================================

name: onyx-backend

services:
  # ===========================================================================
  # API SERVER - Main FastAPI Application
  # ===========================================================================
  api_server:
    image: ${ONYX_BACKEND_IMAGE:-onyxdotapp/onyx-backend:${IMAGE_TAG:-latest}}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: >
      /bin/sh -c "alembic upgrade head &&
      echo \"Starting Onyx Api Server\" &&
      uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    depends_on:
      relational_db:
        condition: service_healthy
      cache:
        condition: service_started
      index:
        condition: service_started
    restart: unless-stopped
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-disabled}
      - POSTGRES_HOST=relational_db
      - VESPA_HOST=index
      - REDIS_HOST=cache
      # Disable local model server - use cloud APIs instead
      - DISABLE_MODEL_SERVER=true
      # MinIO/S3 config (optional - only if using file uploads)
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:-minioadmin}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:-minioadmin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 25s

  # ===========================================================================
  # BACKGROUND WORKER - Celery for async tasks (indexing, syncing)
  # ===========================================================================
  background:
    image: ${ONYX_BACKEND_IMAGE:-onyxdotapp/onyx-backend:${IMAGE_TAG:-latest}}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: >
      /bin/sh -c "/app/scripts/supervisord_entrypoint.sh"
    env_file:
      - path: .env
        required: false
    depends_on:
      relational_db:
        condition: service_healthy
      cache:
        condition: service_started
      index:
        condition: service_started
    restart: unless-stopped
    environment:
      - USE_LIGHTWEIGHT_BACKGROUND_WORKER=true
      - POSTGRES_HOST=relational_db
      - VESPA_HOST=index
      - REDIS_HOST=cache
      - DISABLE_MODEL_SERVER=true
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:-minioadmin}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:-minioadmin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  # ===========================================================================
  # DATA STORES
  # ===========================================================================

  # PostgreSQL - Main relational database
  relational_db:
    image: postgres:15.2-alpine
    shm_size: 1g
    command: -c 'max_connections=250'
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_volume:/var/lib/postgresql/data

  # Redis - Sessions, Celery broker, caching, locks
  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /data

  # Vespa - Vector search engine
  index:
    image: vespaengine/vespa:8.609.39
    restart: unless-stopped
    ports:
      - "19071:19071"
      - "${VESPA_PORT:-8081}:8081"
    environment:
      - VESPA_SKIP_UPGRADE_CHECK=true
    volumes:
      - vespa_volume:/opt/vespa/var
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  # MinIO - S3-compatible file storage (optional, for file uploads)
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_FILE_STORE_BUCKET_NAME:-onyx-file-store-bucket}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  db_volume:
  vespa_volume:
  minio_data:
